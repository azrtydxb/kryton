#
# Kryton on Synology DSM (Container Manager).
#
# Generated from packaging/synology/package/docker-compose.yml by build.sh —
# the __KRYTON_IMAGE__ token is replaced at SPK build time with a fully
# pinned image reference.
#
# Host paths resolve under ${PKG_DATA_PATH} (set in .env by postinst).
# Do not edit this file in place; reconfigure via DSM Package Center.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      - POSTGRES_USER=kryton
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      - POSTGRES_DB=kryton
    volumes:
      - ${PKG_DATA_PATH}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kryton", "-d", "kryton"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - kryton

  kryton:
    image: __KRYTON_IMAGE__
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "1001:1001"
    ports:
      - "${PKG_HOST_PORT:?Set PKG_HOST_PORT}:3000"
    volumes:
      - ${PKG_DATA_PATH}/notes:/notes
      - ${PKG_DATA_PATH}/data:/data
    environment:
      - POSTGRES_URL=postgres://kryton:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/kryton
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - NOTES_DIR=/notes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kryton

networks:
  kryton:
    driver: bridge
