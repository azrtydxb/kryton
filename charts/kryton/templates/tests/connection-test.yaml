apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kryton.fullname" . }}-test-connection
  labels:
    {{- include "kryton.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          wget --spider --quiet \
            "http://{{ include "kryton.fullname" . }}:{{ .Values.service.port }}/healthz" \
            && echo "kryton /healthz OK"
