apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kryton.fullname" . }}
  labels:
    {{- include "kryton.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    # When persistence is enabled and the PVC accessMode is RWO (the
    # default — the chart only supports RWO single-replica anyway),
    # rolling updates deadlock: the new pod can't mount the PVC until
    # the old pod releases it, but the old pod isn't terminated until
    # the new one is ready. Recreate avoids that. Allow RollingUpdate
    # only when the user explicitly opts in (e.g. RWX/ReadWriteMany
    # storage with multi-replica).
    type: {{ .Values.strategy.type | default "Recreate" }}
    {{- if eq (.Values.strategy.type | default "Recreate") "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "kryton.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.externalSecrets.enabled }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "kryton.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "kryton.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kryton
          image: {{ include "kryton.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kryton.configMapName" . }}
            - secretRef:
                name: {{ include "kryton.secretName" . }}
          {{- if and .Values.postgresql.enabled (not .Values.env.secret.POSTGRES_URL) }}
          # POSTGRES_URL auto-synthesized from the embedded subchart.
          # The password is pulled from bitnami's secret at pod-start;
          # K8s env-var substitution (`$(VAR)`) inlines it into
          # POSTGRES_URL. Setting env.secret.POSTGRES_URL explicitly
          # in values.yaml disables this synthesis.
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "kryton.postgresqlSecretName" . }}
                  key: password
            - name: POSTGRES_URL
              value: postgres://{{ .Values.postgresql.auth.username }}:$(POSTGRES_PASSWORD)@{{ include "kryton.postgresqlHost" . }}:5432/{{ .Values.postgresql.auth.database }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              {{- with .Values.persistence.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
            # Plugins dir. The server hardcodes <cwd>/plugins (=/app/plugins
            # in the official image) and the pod runs non-root, so we need a
            # writable mount there. emptyDir is intentional: plugins are
            # either bundled in the image or downloaded by the operator's
            # init-container at pod start, so durability isn't needed.
            - name: plugins
              mountPath: /app/plugins
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kryton.pvcName" . }}
        {{- end }}
        - name: plugins
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
