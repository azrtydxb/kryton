<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <title>Kryton</title>
    <script>
      // Apply prefs before first paint to prevent FOUC
      (function() {
        try {
          var raw = localStorage.getItem('kryton-prefs');
          var p = raw ? JSON.parse(raw).state : null;
          var theme = (p && p.theme) || 'dark';
          var accent = (p && p.accent) || 'violet';
          var density = (p && p.density) || 'compact';
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.dataset.accent = accent;
          root.dataset.density = density;
          if (theme === 'dark') root.classList.add('dark'); else root.classList.remove('dark');
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.accent = 'violet';
          document.documentElement.dataset.density = 'compact';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
