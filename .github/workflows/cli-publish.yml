name: CLI Publish

on:
  push:
    tags: ['cli-v*']
  # Manual trigger lets us re-run cli-publish.yml from master (so
  # workflow fixes are picked up) while publishing an existing tag's
  # version. Use:
  # `gh workflow run cli-publish.yml --ref master -f tag=cli-v<existing>`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing cli-v* tag to publish (omit to use github.ref_name)'
        required: false
        type: string

# Layout:
#
#   resolve-version ── test-mcp ──┐
#                  └── test-init ─┴── publish-mcp ── publish-init
#
# Two npm packages, published independently to npm under @azrtydxb/.
# Build + test each package before publishing. publish-init waits on
# publish-mcp so the shim is on the registry by the time kryton-init's
# install path advertises `npx @azrtydxb/kryton-mcp`.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Resolve semver from tag
        id: ver
        env:
          # workflow_dispatch passes tag via inputs; push event uses ref_name.
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Tag format: cli-v0.1.0 → 0.1.0
          VERSION="${REF#cli-v}"
          if [ "$VERSION" = "$REF" ]; then
            echo "::error::Tag '$REF' does not match expected format 'cli-v<semver>'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved CLI version: $VERSION"

  test-mcp:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build kryton-mcp
        run: npm run build --workspace=packages/kryton-mcp
      - name: Test kryton-mcp
        run: npm run test --workspace=packages/kryton-mcp

  test-init:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build kryton-init
        run: npm run build --workspace=packages/kryton-init
      - name: Test kryton-init
        run: npm run test --workspace=packages/kryton-init

  publish-mcp:
    needs: [resolve-version, test-mcp, test-init]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Pin package version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          npm version "$VERSION" \
            --workspace=packages/kryton-mcp \
            --no-git-tag-version \
            --allow-same-version
      - name: Build kryton-mcp
        run: npm run build --workspace=packages/kryton-mcp
      - name: Publish kryton-mcp to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish \
            --workspace=packages/kryton-mcp \
            --access public \
            --provenance

  publish-init:
    needs: [resolve-version, publish-mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Pin package version
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          npm version "$VERSION" \
            --workspace=packages/kryton-init \
            --no-git-tag-version \
            --allow-same-version
      - name: Build kryton-init
        run: npm run build --workspace=packages/kryton-init
      - name: Publish kryton-init to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish \
            --workspace=packages/kryton-init \
            --access public \
            --provenance
