name: CLI Release

# Per-package npm publish driven by Changesets. Mirrors the
# `azrtydxb/novamem` pattern.
#
# Flow:
#   1. PR adds `.changeset/<slug>.md` describing what changed and which
#      packages bump (patch / minor / major). Run `npx changeset` to
#      generate one. The file is committed alongside the change.
#   2. On every push to `master`, the changesets action looks for
#      unconsumed `.changeset/*.md` files. If any exist, it opens
#      (or updates) a "Version Packages" PR that bumps the affected
#      package.json versions, regenerates per-package CHANGELOGs, and
#      deletes the consumed changeset files.
#   3. When that "Version Packages" PR is merged, this same workflow
#      runs with no pending changesets — the action then runs
#      `changeset publish` which only publishes packages whose
#      package.json version doesn't yet exist on npm. So one merge =
#      N publishes (only the changed packages).
#
# Auth: npm Trusted Publishers (OIDC) — no `NPM_TOKEN` secret. Each
# of the two publishable packages has a Trusted Publisher binding on
# npmjs.com pointing at this workflow file + repo. Node 24 ships
# npm 11.x which does the OIDC handshake for the publish PUT itself.
#
# Provenance: `--provenance` (via `publishConfig.provenance: true`
# in each package.json + `NPM_CONFIG_PROVENANCE: "true"` env) attaches
# a Sigstore attestation tying each tarball to this exact workflow
# run + commit. Requires `id-token: write`.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: changesets release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: github.ref == 'refs/heads/master'
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Build CLI packages
        run: |
          npm run -w @azrtydxb/kryton-mcp build
          npm run -w @azrtydxb/kryton-init build
      - name: Test CLI packages
        run: |
          npm run -w @azrtydxb/kryton-mcp test
          npm run -w @azrtydxb/kryton-init test
      - name: Version + publish
        uses: changesets/action@v1
        with:
          version: npx changeset version
          publish: npx changeset publish
          title: "chore(release): version cli packages"
          commit: "chore(release): version cli packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bootstrap auth via classic token for the first publish.
          # changesets-action looks for NPM_TOKEN (not NODE_AUTH_TOKEN)
          # to decide between token-auth and OIDC. After packages exist
          # on npm we'll bind Trusted Publishers and remove this.
          NPM_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
