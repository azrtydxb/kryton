name: E2E

# Full Kryton boot + HTTP API + MCP transport + restart-persistence.
# Heavy and slow; not run on every commit. Trigger this when you want
# to verify the full stack works end-to-end without cutting a release:
#
#   gh workflow run e2e.yml
#
# Or click "Run workflow" on the Actions tab → E2E.
#
# Also runs automatically as a gate inside release.yml when you cut
# a `v*` tag — no need to trigger this separately before tagging.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test (default: master)"
        required: false
        default: "master"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    runs-on: [self-hosted, kryton-248]
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (ui, sdk)
        run: npm run build:shared

      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server

      - name: E2E suite (API + MCP + restart-persistence)
        run: npm run test:e2e --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          SEMANTIC_PROVIDER: "off"

      - name: Restore workspace ownership to host user
        if: always()
        run: chown -R 1000:1000 . || true
