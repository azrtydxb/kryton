name: E2E

# Full Kryton boot + HTTP API + MCP transport + restart-persistence.
# Heavy and slow; not run on every commit. Trigger this when you want
# to verify the full stack works end-to-end without cutting a release:
#
#   gh workflow run e2e.yml
#
# Or click "Run workflow" on the Actions tab → E2E.
#
# Also runs automatically as a gate inside release.yml when you cut
# a `v*` tag — no need to trigger this separately before tagging.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to test (default: master)"
        required: false
        default: "master"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  e2e:
    # ARC v2 scale-set on the kw cluster — see ci.yml for the same
    # migration. Single label only; chown UID is 1001 (not 1000).
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      id-token: write # Kuvryn Ant OIDC (azrtydxb/ant-setup-action)
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: azrtydxb/ant-setup-action@7c6f1b8ca34a0a127b43040f4e16bbafdbd83791 # v1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (ui, sdk)
        run: npm run build:shared

      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          # Service health-check options are ignored by ARC kubernetes mode, so
          # wait for postgres (reachable on localhost in the job pod) here.
          for i in $(seq 1 60); do
            pg_isready -h localhost -U kryton -d kryton_test && break
            if [ "$i" = 60 ]; then echo "postgres not ready" >&2; exit 1; fi
            sleep 2
          done
          psql -h localhost -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server

      - name: E2E suite (API + MCP + restart-persistence)
        run: npm run test:e2e --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          SEMANTIC_PROVIDER: "off"

      - name: Restore workspace ownership to runner user
        # ARC runner UID is 1001 (not 1000 as on the old kryton-248
        # box). Without this the post-job actions/checkout cleanup
        # fails on the bind-mounted workspace.
        if: always()
        run: chown -R 1001:1001 . || true

  # Three parallel smoke jobs exercise each deployment surface end-to-
  # end against a real artifact. They share no state with the `e2e`
  # job above and run concurrently as siblings.
  compose-smoke:
    # Brings up the production compose stack, polls /health until it
    # returns 200, then tears it down. Runs on the publish scale set
    # because we need real docker access (the default arc-azrtydxb
    # pods don't have a docker daemon socket the way `-publish` does).
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Generate compose env
        # docker-compose.prod.yml uses ${VAR:?} for required values.
        # Provide the minimum set so the stack boots in CI.
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=kryton-smoke
          BETTER_AUTH_SECRET=ci-smoke-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL=http://localhost:3100
          APP_URL=http://localhost:3100
          EOF
      # The ARC runner image has the docker CLI (talking to the pod's dind
      # sidecar) but not the Compose plugin. Upstream release binary,
      # pinned by SHA-256.
      - name: Install docker compose plugin
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.docker/cli-plugins"
          plugin="$HOME/.docker/cli-plugins/docker-compose"
          curl -fsSL "https://github.com/docker/compose/releases/download/v2.40.2/docker-compose-linux-aarch64" -o "$plugin"
          echo "20e30dda8d0133895b7991bcfec1eb2c02f9d38c8de9e73669daf9fb83df49e6  $plugin" | sha256sum -c -
          chmod +x "$plugin"
          docker compose version
      - name: docker compose up
        # docker-compose.prod.yml does not mount the postgres-init script
        # that enables pgvector (docker-compose.yml does), so the server's
        # migrations fail with `type "vector" does not exist`. Enable the
        # extension before the server starts.
        run: |
          set -euo pipefail
          compose="docker compose -f docker-compose.prod.yml --env-file .env"
          $compose up -d postgres
          for i in $(seq 1 60); do
            $compose exec -T postgres pg_isready -U kryton -d kryton && break
            if [ "$i" = 60 ]; then echo "postgres not ready" >&2; exit 1; fi
            sleep 2
          done
          $compose exec -T postgres psql -U kryton -d kryton -c "CREATE EXTENSION IF NOT EXISTS vector"
          $compose up -d
      - name: Wait for /health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            # docker-compose.prod.yml publishes the server on 3100.
            if curl -fsS http://localhost:3100/health > /dev/null; then
              echo "health OK after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "health never came up"
          docker compose -f docker-compose.prod.yml logs --tail=200
          exit 1
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env down -v || true

  helm-smoke:
    # Spins up a kind cluster inside the runner, installs the chart
    # from the repo, waits for the kryton Pod ready + /health 200,
    # tears down the cluster.
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: kryton-helm-smoke
          wait: 120s
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Unpack subchart tgzs
        # The chart's .helmignore excludes *.tgz, so helm skips the committed
        # charts/postgresql-*.tgz and reports it "missing in charts/
        # directory". Unpack it, as release.yml's helm-publish does.
        run: |
          set -euo pipefail
          cd charts/kryton/charts
          for f in *.tgz; do
            [ -f "$f" ] || continue
            tar -xzf "$f"
            rm "$f"
          done
          ls
      - name: Helm install
        run: |
          helm install kryton charts/kryton \
            --namespace kryton-smoke --create-namespace \
            --wait --timeout 5m
      - name: Health check via port-forward
        run: |
          set -euo pipefail
          kubectl -n kryton-smoke wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=kryton --timeout=300s
          kubectl -n kryton-smoke port-forward svc/kryton 8080:80 &
          PF=$!
          trap "kill $PF || true" EXIT
          sleep 5
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "helm /health OK after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "helm /health never came up"
          kubectl -n kryton-smoke get all
          kubectl -n kryton-smoke logs -l app.kubernetes.io/name=kryton --tail=200
          exit 1
      - name: Teardown
        if: always()
        run: kind delete cluster --name kryton-helm-smoke || true

  operator-smoke:
    # Same as helm-smoke but installs the CRD bundle + operator
    # Deployment first, then applies a minimal Kryton CR and waits
    # for status.conditions[Ready]=True before asserting /health.
    runs-on: arc-azrtydxb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          cluster_name: kryton-operator-smoke
          wait: 120s
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Apply CRD bundle
        run: |
          set -euo pipefail
          for f in operator/config/crd/bases/*.yaml; do
            kubectl apply -f "$f"
          done
      - name: Build operator image into kind
        # config/manager references the kubebuilder placeholder
        # `controller:latest`, which no registry serves. Build the operator
        # from this ref (with the chart synced into its embed, as release.yml
        # does) and load it into the kind cluster.
        run: |
          set -euo pipefail
          # Unpack the subchart tgz first: helm's loader honours the chart's
          # .helmignore (*.tgz), as in helm-smoke.
          (cd charts/kryton/charts && for f in *.tgz; do [ -f "$f" ] || continue; tar -xzf "$f"; rm "$f"; done)
          rm -rf operator/internal/chartfs/chart
          mkdir -p operator/internal/chartfs/chart
          cp -R charts/kryton/. operator/internal/chartfs/chart/
          # The Dockerfile's GO_VERSION default (1.22) is older than go.mod.
          go_version=$(sed -n 's/^go \([0-9.]*\)$/\1/p' operator/go.mod)
          docker build --build-arg GO_VERSION="$go_version" \
            -t kryton-operator:smoke -f operator/Dockerfile operator
          kind load docker-image kryton-operator:smoke --name kryton-operator-smoke
          sed -i 's|image: controller:latest|image: kryton-operator:smoke|' operator/config/manager/manager.yaml
      - name: Deploy operator
        # The operator image is built and pushed by release.yml. In
        # the e2e workflow we install via the same helm chart pattern
        # the operator project uses under operator/config; this assumes
        # WS-C ships a `make deploy` equivalent or a deploy manifest at
        # operator/config/default. Fall back to kustomize build.
        run: |
          set -euo pipefail
          kubectl create namespace kryton-operator-system || true
          if [ -d operator/config/default ]; then
            kubectl kustomize operator/config/default | kubectl apply -f -
          else
            echo "No operator/config/default kustomize root found" >&2
            exit 1
          fi
          if ! kubectl -n kryton-operator-system rollout status \
            deploy --timeout=300s; then
            kubectl -n kryton-operator-system describe pods || true
            kubectl -n kryton-operator-system logs -l control-plane=controller-manager --tail=200 || true
            exit 1
          fi
      - name: Apply minimal Kryton CR
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: kryton.azrtydxb.io/v1alpha1
          kind: Kryton
          metadata:
            name: smoke
            namespace: default
          spec:
            values:
              ingress:
                enabled: false
              postgresql:
                enabled: true
          EOF
      - name: Wait for Ready condition
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            ready=$(kubectl get kryton smoke -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "")
            if [ "$ready" = "True" ]; then
              echo "Kryton CR Ready after ${i} polls"
              break
            fi
            sleep 5
          done
          kubectl wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=kryton --timeout=300s
      - name: Health check via port-forward
        run: |
          set -euo pipefail
          kubectl port-forward svc/smoke-kryton 8080:80 &
          PF=$!
          trap "kill $PF || true" EXIT
          sleep 5
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "operator /health OK after ${i} polls"
              exit 0
            fi
            sleep 2
          done
          echo "operator /health never came up"
          kubectl get kryton smoke -o yaml || true
          kubectl get all -A
          kubectl -n kryton-operator-system logs -l control-plane=controller-manager --tail=200 || true
          exit 1
      - name: Teardown
        if: always()
        run: kind delete cluster --name kryton-operator-smoke || true
