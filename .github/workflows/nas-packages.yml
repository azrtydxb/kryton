name: nas-packages

# Phase 1 of the NAS package stores plan (docs/design/nas-package-stores.md).
# Manual-dispatch only — renders the Synology + QNAP feed files from the
# templates in packaging/feeds/ and opens a PR against master.
#
# Phase 4 will wire this renderer into release.yml so the feeds get real
# size/md5/signature values from the built SPK/QPKG artifacts. Until then,
# this workflow is operator-driven.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Kryton version (e.g. 1.4.2)'
        required: true
        type: string
      published_date:
        description: 'Published date YYYY-MM-DD (defaults to today UTC)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: nas-packages-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  render:
    # Matches the self-hosted runner pattern used throughout release.yml.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Compute published date
        id: date
        shell: bash
        run: |
          if [ -n "${{ inputs.published_date }}" ]; then
            echo "value=${{ inputs.published_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build feed config
        id: config
        shell: bash
        env:
          KRYTON_VERSION: ${{ inputs.version }}
          KRYTON_PUB_DATE: ${{ steps.date.outputs.value }}
        run: |
          cat > /tmp/feed-config.json <<EOF
          {
            "version": "${KRYTON_VERSION}",
            "publishedDate": "${KRYTON_PUB_DATE}",
            "changelogUrl": "https://github.com/${{ github.repository }}/releases/tag/v${KRYTON_VERSION}",
            "iconBaseUrl": "https://azrtydxb.github.io/kryton/assets/nas/icons",
            "screenshotBaseUrl": "https://azrtydxb.github.io/kryton/assets/nas/screenshots",
            "releaseAssetBaseUrl": "https://github.com/${{ github.repository }}/releases/download/v${KRYTON_VERSION}",
            "synologyArchs": ["x86_64", "armv8"],
            "qnapPlatforms": ["X86_64", "ARM_64"],
            "spkSizes":  { "x86_64": 0, "armv8": 0 },
            "spkMd5":    { "x86_64": "", "armv8": "" },
            "qpkgSigs":  { "X86_64": null, "ARM_64": null }
          }
          EOF
          cat /tmp/feed-config.json

      - name: Render feeds
        run: node packaging/feeds/render.mjs --config /tmp/feed-config.json

      - name: Renderer self-test
        run: node --test packaging/feeds/render.test.mjs

      - name: Open PR with rendered feeds
        uses: peter-evans/create-pull-request@v6
        with:
          branch: nas-feeds/v${{ inputs.version }}
          base: master
          commit-message: |
            feat(nas): render NAS feeds for v${{ inputs.version }}

            Generated by .github/workflows/nas-packages.yml from
            packaging/feeds/{index.json.tmpl,packages.xml.tmpl}.
            Phase 1 placeholder values (size=0, md5="", sigs=null) — Phase 4
            will replace these with real artifact metadata.
          title: 'feat(nas): render NAS feeds for v${{ inputs.version }}'
          body: |
            Renders `site/public/synology/index.json` and
            `site/public/qnap/packages.xml` for version
            `${{ inputs.version }}`, published `${{ steps.date.outputs.value }}`.

            Phase 1 of `docs/design/nas-package-stores.md`. Size/md5/signature
            fields are placeholders until Phase 4 wires the renderer into
            `release.yml` with real artifact metadata.

            Runner: `arc-azrtydxb` (matches existing `release.yml` self-hosted
            runner usage). If this job fails because the self-hosted runner
            cannot reach `peter-evans/create-pull-request@v6`, switch the
            workflow to `runs-on: ubuntu-latest` and re-dispatch.
          delete-branch: true

  # ---------------------------------------------------------------------------
  # Phase 2 — build the Synology SPK (one per arch). Sibling of `render`,
  # runs in parallel. Phase 4 will move this into release.yml; for now it is
  # operator-invoked alongside the manual feed render.
  #
  # Signing is opt-in: if SYNOLOGY_SIGNING_KEY is absent, build.sh emits an
  # unsigned SPK (good for smoke tests). CI for real releases must populate
  # the secrets first.
  # ---------------------------------------------------------------------------
  build-spk:
    if: inputs.version != ''
    runs-on: arc-azrtydxb
    container:
      image: node:24
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, armv8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            gnupg2 \
            tar \
            file \
            ca-certificates
          # GNU coreutils ships sha256sum/md5sum on Debian-based node:24.
          which gpg tar file sha256sum md5sum

      - name: Smoke-test build.sh (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/synology/build.test.sh

      - name: Detect signing secret availability
        id: secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SYNOLOGY_SIGNING_KEY }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ]; then
            echo "have_key=true"  >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "WARN: SYNOLOGY_SIGNING_KEY not set — SPK will be unsigned." >&2
          fi

      - name: Import GPG signing key
        id: gpg
        if: steps.secrets.outputs.have_key == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SYNOLOGY_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SYNOLOGY_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d -t kryton-gpg.XXXXXX)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          # Configure gpg-agent for non-interactive use with the passphrase.
          mkdir -p "$GNUPGHOME"
          cat > "$GNUPGHOME/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          EOF
          cat > "$GNUPGHOME/gpg.conf" <<'EOF'
          pinentry-mode loopback
          EOF
          # Surface the long-form key ID for downstream steps.
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "gnupghome=$GNUPGHOME" >> "$GITHUB_OUTPUT"
          # Cache passphrase via preset so gpg --detach-sign does not prompt.
          gpgconf --launch gpg-agent
          # Use --passphrase via build.sh? Simpler: rely on loopback + a one-off
          # signature here to prime the agent (no real artifact emitted).
          echo "test" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --local-user "$KEY_ID" --armor --detach-sign --output /dev/null

      - name: Build SPK
        shell: bash
        env:
          KRYTON_VERSION: ${{ inputs.version }}
          KRYTON_ARCH: ${{ matrix.arch }}
          KRYTON_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          OUT_DIR: ${{ github.workspace }}/build/synology
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          GPG_KEYRING_DIR: ${{ steps.gpg.outputs.gnupghome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          bash packaging/synology/build.sh

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryton-spk-${{ matrix.arch }}
          path: build/synology/kryton_${{ inputs.version }}-0001_${{ matrix.arch }}.spk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Phase 3 — build the QNAP QPKG (one per platform). Sibling of `render` and
  # `build-spk`. qbuild relies on GNU coreutils paths so this job is Linux-only.
  # Phase 4 will move this into release.yml; for now it is operator-invoked.
  #
  # Code signing is opt-in: if QNAP_CODESIGN_CERT and QNAP_CODESIGN_KEY are
  # absent, build.sh emits an unsigned QPKG (smoke testing). CI for real
  # releases must populate both secrets.
  # ---------------------------------------------------------------------------
  build-qpkg:
    if: inputs.version != ''
    needs: render
    runs-on: arc-azrtydxb
    container:
      image: node:24
    strategy:
      fail-fast: false
      matrix:
        platform: [X86_64, ARM_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          # binutils provides `ar` for extracting QDK's .deb. file/openssl/curl
          # are needed by build.sh; imagemagick produces the gray icon variant.
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y \
            bash tar gzip openssl file curl binutils imagemagick

      - name: Smoke-test build.sh (unsigned)
        shell: bash
        run: bash packaging/qnap/build.test.sh

      - name: Stage code-signing material (if available)
        id: sign
        shell: bash
        env:
          QNAP_CODESIGN_CERT: ${{ secrets.QNAP_CODESIGN_CERT }}
          QNAP_CODESIGN_KEY:  ${{ secrets.QNAP_CODESIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${QNAP_CODESIGN_CERT:-}" ] && [ -n "${QNAP_CODESIGN_KEY:-}" ]; then
            install -d -m 700 "${RUNNER_TEMP}/qnap-keys"
            printf '%s\n' "${QNAP_CODESIGN_CERT}" > "${RUNNER_TEMP}/qnap-keys/codesign.crt"
            printf '%s\n' "${QNAP_CODESIGN_KEY}"  > "${RUNNER_TEMP}/qnap-keys/codesign.key"
            chmod 600 "${RUNNER_TEMP}/qnap-keys/codesign.key"
            echo "cert=${RUNNER_TEMP}/qnap-keys/codesign.crt" >> "${GITHUB_OUTPUT}"
            echo "key=${RUNNER_TEMP}/qnap-keys/codesign.key"  >> "${GITHUB_OUTPUT}"
            echo "::notice::Code-signing material present; QPKG will be signed."
          else
            echo "cert=" >> "${GITHUB_OUTPUT}"
            echo "key="  >> "${GITHUB_OUTPUT}"
            echo "::warning::QNAP_CODESIGN_CERT / QNAP_CODESIGN_KEY not set — building unsigned."
          fi

      - name: Build QPKG (${{ matrix.platform }})
        shell: bash
        env:
          KRYTON_VERSION: ${{ inputs.version }}
          KRYTON_PLATFORM: ${{ matrix.platform }}
          KRYTON_IMAGE: ghcr.io/${{ github.repository }}/kryton:${{ inputs.version }}
          OUT_DIR: ${{ github.workspace }}/build/qnap
          QPKG_SIGNING_CERT: ${{ steps.sign.outputs.cert }}
          QPKG_SIGNING_KEY:  ${{ steps.sign.outputs.key }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          bash packaging/qnap/build.sh

      - name: Scrub signing key from disk
        if: always()
        shell: bash
        run: |
          if [ -d "${RUNNER_TEMP}/qnap-keys" ]; then
            find "${RUNNER_TEMP}/qnap-keys" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${RUNNER_TEMP}/qnap-keys"
          fi

      - name: Upload QPKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryton-qpkg-${{ matrix.platform }}
          path: |
            build/qnap/*.qpkg
            build/qnap/*.qpkg.codesigning
          if-no-files-found: error
          retention-days: 14
