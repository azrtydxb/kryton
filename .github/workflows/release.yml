name: Release

on:
  push:
    tags: ['v*']
  # Manual trigger lets us re-run release.yml from master (so workflow
  # fixes are picked up) while publishing an existing tag's version.
  # Use: `gh workflow run release.yml --ref master -f tag=v<existing-tag>`.
  # The `tag` input replaces github.ref_name for chart/version strings.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to publish (omit to use github.ref_name)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kryton
  OPERATOR_IMAGE_NAME: ${{ github.repository }}/kryton-operator
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Layout:
#
#   typecheck ─┐
#   lint       │                                                  ┌── helm-publish ──┐
#   test       ├── build-arm64 ────────────┐                      │                  │
#   e2e        │                           ├── manifest ──────────┼── mirror         ├── release
#   build ─────┴── build-amd64 ────────────┘                      │                  │
#               ├── build-operator-arm64 ─┐                       └── manifest-operator
#               └── build-operator-amd64 ─┴── manifest-operator ──┘
#
# Server image DAG (top half) mirrors the prior shape unchanged.
# Operator image DAG (bottom half) follows the same per-arch pattern:
# local-arm64 dind + remote-amd64 NAS BuildKit, then `manifest-
# operator` stitches the digests. `helm-publish` packages and pushes
# the chart OCI artifact in parallel with the server `manifest` chain.
# `mirror` is extended to copy the chart and operator image to the
# cluster zot alongside the server image. `release` waits on the
# server manifest, the operator manifest, and helm-publish.

jobs:
  typecheck:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - if: always()
        run: chown -R 1001:1001 . || true

  lint:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - if: always()
        run: chown -R 1001:1001 . || true

  test:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server
      - name: Unit tests
        run: npm run test
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
      - if: always()
        run: chown -R 1001:1001 . || true

  e2e:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server
      - name: E2E suite (API + MCP + restart-persistence)
        run: npm run test:e2e --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          SEMANTIC_PROVIDER: "off"
      - if: always()
        run: chown -R 1001:1001 . || true

  build:
    # Produces server-dist + client-dist artifacts consumed by the
    # docker fan-out. Doesn't gate on typecheck/lint/test — those run
    # in parallel as siblings; their failure independently blocks the
    # docker jobs via `needs`.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build
      - if: always()
        run: chown -R 1001:1001 . || true
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist

  # Multi-arch docker build/push, fan-out per arch. arm64 builds in
  # the dind sidecar natively; amd64 builds on the remote BuildKit at
  # 192.168.10.253:1234 natively (~15× faster than QEMU). Each job
  # pushes by digest to ghcr.io; the `manifest` job assembles the
  # final multi-arch tags. Splitting per arch lets the two builders
  # run truly concurrently instead of sequentially in one job.
  #
  # The cookbook's `--name multi --append` snippet doesn't work in
  # current buildx (mixed drivers are unsupported). Per-job builders
  # sidestep that entirely.
  build-arm64:
    needs: [typecheck, lint, test, e2e, build]
    # `arc-azrtydxb-publish` is identical to `arc-azrtydxb` except its
    # pod template omits the `ghcr.io → 192.168.10.122` hostAlias. The
    # mirror is a pull-through cache that doesn't accept writes AND
    # serves a cluster-CA-signed cert that buildkit-container doesn't
    # trust — both made push from inside dind fail with a TLS
    # 'unknown authority' error on the regular arc-azrtydxb scale set.
    # Without the hostAlias, ghcr.io resolves to its real public CDN
    # via CoreDNS and pushes work with the standard public TLS chain.
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up local arm64 builder
        run: |
          # arm64 native via the dind sidecar.  The inline buildkitd
          # config marks the cluster zot registry as insecure so this
          # builder can push/pull cache layers without needing the
          # cluster CA in buildkit-container's trust store.
          cat > /tmp/buildkitd-local.toml <<'EOF'
          [registry."192.168.10.123:5000"]
            http = false
            insecure = true
          EOF
          docker buildx create \
            --name local-arm64 \
            --driver docker-container \
            --platform linux/arm64 \
            --buildkitd-config /tmp/buildkitd-local.toml
          docker buildx inspect --bootstrap local-arm64
      - name: Build + push arm64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: local-arm64
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          # Buildkit cache lives in the in-cluster zot registry at
          # 192.168.10.123:5000 — pushes/pulls over the cluster LAN
          # instead of GHA cache over the NAS uplink. mode=max stores
          # all intermediate layers (full hit rate); image-manifest=true
          # uses OCI manifest format which buildx and crane both prefer.
          cache-from: type=registry,ref=192.168.10.123:5000/buildcache/kryton:linux-arm64
          cache-to: type=registry,ref=192.168.10.123:5000/buildcache/kryton:linux-arm64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  build-amd64:
    needs: [typecheck, lint, test, e2e, build]
    runs-on: arc-azrtydxb-amd64-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up remote amd64 builder
        run: |
          # amd64 native via the remote BuildKit on 192.168.10.253.
          # Certs + endpoint are auto-injected into every arc-azrtydxb
          # runner pod by the AutoscalingRunnerSet template. Remote-
          # driver builders inherit the daemon's registry trust config;
          # we cannot patch it from the workflow.
          docker buildx create \
            --name remote-amd64 \
            --driver remote \
            --platform linux/amd64 \
            --driver-opt cacert="$BUILDKIT_CLIENT_CA" \
            --driver-opt cert="$BUILDKIT_CLIENT_CERT" \
            --driver-opt key="$BUILDKIT_CLIENT_KEY" \
            "$BUILDKIT_AMD64_ENDPOINT"
          docker buildx inspect --bootstrap remote-amd64
      - name: Build + push amd64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: remote-amd64
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          # Cache goes to ghcr.io instead of the cluster zot. The NAS
          # buildkit-container's /etc/buildkit/buildkitd.toml does NOT
          # currently trust the cluster CA, so pushing cache layers to
          # https://192.168.10.123:5000 fails with x509 unknown-
          # authority. ghcr.io has a public CA chain that everything
          # trusts and we're already authenticated for image push.
          # TODO: when buildkit-container on the NAS gets cluster-
          # ca.crt mounted + buildkitd.toml updated, switch back to
          # 192.168.10.123:5000/buildcache/kryton:linux-amd64 for the
          # LAN-speed advantage.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:linux-amd64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:linux-amd64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  manifest:
    needs: [build-arm64, build-amd64]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Assemble multi-arch manifest list
        # The per-arch jobs' `digest` outputs are the sha256 of each
        # pushed image. `imagetools create` stitches them into a
        # manifest list under the human-friendly tags from
        # metadata-action.
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-arm64.outputs.digest }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-amd64.outputs.digest }}"
      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  # Mirror the freshly-published multi-arch image from ghcr.io to the
  # in-cluster zot at 192.168.10.123:5000 so harbor.kw.local shows the
  # latest kryton tags too. Uses `docker buildx imagetools create`,
  # which does a server-side registry-to-registry transfer (no
  # rebuild, no local pull) and preserves the multi-arch manifest
  # list. Anonymous push works — same path the arm64 buildcache has
  # been using since the cluster zot was wired up. Runs in parallel
  # with `release`; not a gate (mirror failures don't block the
  # GitHub release).
  mirror:
    # Needs both image manifests AND the helm chart push: mirror copies
    # all three artifacts to the cluster zot, and reading the chart
    # back from ghcr races against helm-publish's push otherwise.
    needs: [manifest, manifest-operator, helm-publish]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr (source)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Mirror server tags to cluster zot
        # `docker buildx imagetools create` is client-side and ignores
        # the buildkitd insecure-registry config, so cross-registry
        # copies to the cluster zot (cluster-CA cert) fail with x509
        # unknown-authority. skopeo has explicit per-direction TLS
        # flags. Run via the official quay.io/skopeo/stable image
        # because the runner user can't apt-get (non-root pod). The
        # dind sidecar can't see the runner pod's ~/.docker/config.json,
        # so credentials are passed via --src-creds populated from a
        # step env that github actions resolves before bash runs.
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for src in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            dst="${src/ghcr.io/192.168.10.123:5000}"
            echo "Mirroring server: $src → $dst"
            docker run --rm quay.io/skopeo/stable copy --multi-arch all \
              --src-tls-verify=true --dest-tls-verify=false \
              --src-creds="$SRC_CREDS" \
              "docker://$src" "docker://$dst"
          done
      - name: Extract operator metadata
        id: meta-operator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Mirror operator tags to cluster zot
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for src in $(jq -r '.tags[]' <<< '${{ steps.meta-operator.outputs.json }}'); do
            dst="${src/ghcr.io/192.168.10.123:5000}"
            echo "Mirroring operator: $src → $dst"
            docker run --rm quay.io/skopeo/stable copy --multi-arch all \
              --src-tls-verify=true --dest-tls-verify=false \
              --src-creds="$SRC_CREDS" \
              "docker://$src" "docker://$dst"
          done
      - name: Mirror helm chart artifact to cluster zot
        env:
          # Prefer the workflow_dispatch input if provided; otherwise
          # fall back to the tag that triggered the push event.
          VERSION: ${{ inputs.tag || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHART_VER="${VERSION#v}"
          SRC="ghcr.io/${OWNER}/charts/kryton:${CHART_VER}"
          DST="192.168.10.123:5000/${OWNER}/charts/kryton:${CHART_VER}"
          echo "Mirroring chart: $SRC → $DST"
          docker run --rm quay.io/skopeo/stable copy \
            --src-tls-verify=true --dest-tls-verify=false \
            --src-creds="$SRC_CREDS" \
            "docker://$SRC" "docker://$DST"

  # Package + push the Helm chart as an OCI artifact to ghcr.io.
  # Runs in parallel with `mirror` and `release`; gated on `manifest`
  # so the server image referenced by the chart's appVersion exists
  # by the time the chart is published.
  helm-publish:
    needs: [manifest]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      chart-ref: ${{ steps.push.outputs.chart-ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Log in to ghcr (helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Resolve chart version from tag
        id: ver
        env:
          # workflow_dispatch passes tag via inputs; push event uses ref_name.
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - name: Helm dependency update
        run: helm dependency update charts/kryton
      - name: Unpack subchart tgzs
        # `helm package` rejects tgz-only deps with a misleading
        # "missing in charts/ directory" error. Unpack each tgz into
        # the directory layout it actually wants.
        run: |
          set -euo pipefail
          cd charts/kryton/charts
          for f in *.tgz; do
            [ -f "$f" ] || continue
            tar -xzf "$f"
            rm "$f"
          done
          ls
      - name: Helm package
        run: |
          helm package charts/kryton \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination .
      - name: Helm push to ghcr
        id: push
        run: |
          set -euo pipefail
          PKG="kryton-${{ steps.ver.outputs.version }}.tgz"
          DEST="oci://ghcr.io/${{ github.repository_owner }}/charts"
          echo "Pushing $PKG → $DEST"
          helm push "$PKG" "$DEST"
          echo "chart-ref=ghcr.io/${{ github.repository_owner }}/charts/kryton:${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"

  # Operator image build, fan-out per arch. Mirrors the per-arch
  # pattern used for the server image: local-arm64 dind, remote-amd64
  # NAS BuildKit. arm64 cache → cluster zot, amd64 cache → ghcr (per
  # the cluster-CA trust gap on the NAS buildkit-container).
  build-operator-arm64:
    needs: [typecheck, lint, test, e2e]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync chart into operator embed
        # The operator's Dockerfile expects the helm chart at
        # operator/internal/chartfs/chart/. The chart lives at
        # charts/kryton/; sync-chart copies it in. Without this step
        # the build would embed the placeholder chart from WS-C bring-
        # up, not the real one.
        run: rm -rf operator/internal/chartfs/chart && mkdir -p operator/internal/chartfs/chart && cp -R charts/kryton/. operator/internal/chartfs/chart/
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up local arm64 builder
        run: |
          cat > /tmp/buildkitd-local.toml <<'EOF'
          [registry."192.168.10.123:5000"]
            http = false
            insecure = true
          EOF
          docker buildx create \
            --name local-arm64-operator \
            --driver docker-container \
            --platform linux/arm64 \
            --buildkitd-config /tmp/buildkitd-local.toml
          docker buildx inspect --bootstrap local-arm64-operator
      - name: Build + push operator arm64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          builder: local-arm64-operator
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=192.168.10.123:5000/buildcache/kryton-operator:linux-arm64
          cache-to: type=registry,ref=192.168.10.123:5000/buildcache/kryton-operator:linux-arm64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  build-operator-amd64:
    needs: [typecheck, lint, test, e2e]
    runs-on: arc-azrtydxb-amd64-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync chart into operator embed
        run: rm -rf operator/internal/chartfs/chart && mkdir -p operator/internal/chartfs/chart && cp -R charts/kryton/. operator/internal/chartfs/chart/
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up remote amd64 builder
        run: |
          docker buildx create \
            --name remote-amd64-operator \
            --driver remote \
            --platform linux/amd64 \
            --driver-opt cacert="$BUILDKIT_CLIENT_CA" \
            --driver-opt cert="$BUILDKIT_CLIENT_CERT" \
            --driver-opt key="$BUILDKIT_CLIENT_KEY" \
            "$BUILDKIT_AMD64_ENDPOINT"
          docker buildx inspect --bootstrap remote-amd64-operator
      - name: Build + push operator amd64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          builder: remote-amd64-operator
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache-operator:linux-amd64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache-operator:linux-amd64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  manifest-operator:
    needs: [build-operator-arm64, build-operator-amd64]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Assemble multi-arch operator manifest list
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}@${{ needs.build-operator-arm64.outputs.digest }}" \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}@${{ needs.build-operator-amd64.outputs.digest }}"
      - name: Inspect operator manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}:latest"
      - name: Upload CRD bundle as release asset
        # The CRD bundle from `make manifests` under operator/config/crd/bases
        # is published as a workflow artifact here so the `release` job
        # can attach it to the GitHub Release.
        uses: actions/upload-artifact@v4
        with:
          name: operator-crd-bundle
          path: operator/config/crd/bases/

  release:
    needs: [typecheck, lint, test, e2e, build, manifest, manifest-operator, helm-publish]
    runs-on: arc-azrtydxb
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Download CRD bundle
        uses: actions/download-artifact@v4
        with:
          name: operator-crd-bundle
          path: crd-bundle
      - name: Bundle CRDs into single yaml
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ -d crd-bundle ] && [ -n "$(ls -A crd-bundle 2>/dev/null)" ]; then
            # Concatenate every CRD into a single multi-document yaml so
            # users can `kubectl apply -f kryton-crds.yaml` in one shot.
            first=1
            for f in crd-bundle/*.yaml; do
              if [ $first -eq 0 ]; then
                echo "---" >> release-assets/kryton-crds.yaml
              fi
              cat "$f" >> release-assets/kryton-crds.yaml
              first=0
            done
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
          files: |
            release-assets/kryton-crds.yaml

  publish-sdk:
    # Publish @azrtydxb/kryton-sdk to public npm via npm Trusted Publishers (OIDC) —
    # the same tokenless mechanism the CLI packages use in cli-publish.yml, and
    # mirroring the azrtydxb/novamem pattern. No NPM_TOKEN secret: Node 24 ships
    # npm 11.x which does the OIDC handshake for the publish PUT, and
    # `--provenance` (publishConfig.provenance + NPM_CONFIG_PROVENANCE) attaches
    # a Sigstore attestation tying the tarball to this workflow run + commit.
    #
    # Requires a Trusted Publisher binding on npmjs.com for @azrtydxb/kryton-sdk
    # pointing at this repo (azrtydxb/kryton) + workflow (release.yml). Gates on
    # `release` so the npm version aligns with the GitHub Release tag.
    needs: [release]
    runs-on: arc-azrtydxb
    container:
      image: node:24
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build --workspace=packages/sdk
      - name: Publish SDK to npm (OIDC trusted publishing)
        run: node scripts/release-sdk.js
      - if: always()
        run: chown -R 1001:1001 . || true

  # ===========================================================================
  # Phase 4 — NAS package source wiring.
  #
  # Builds signed SPK (Synology) and QPKG (QNAP) packages, attaches them as
  # release assets, and opens a PR that lands the rendered Synology JSON +
  # QNAP XML feeds in site/public/. The existing pages.yml deploys those
  # feeds via its `site/**` path filter once the PR is merged.
  #
  # Dependency graph (additions only — no existing job is edited):
  #
  #   manifest ──┬── nas-build-spk    (matrix: x86_64, armv8)  ──┐
  #              ├── nas-build-qpkg   (matrix: X86_64, ARM_64)  ─┤
  #              │                                                ▼
  #              │                                       nas-upload-assets
  #              │                                                │
  #              │                                                ▼
  #              ▼                                       nas-publish-feeds
  #            release ─────────────────────────────────────────┘
  #
  # `release` itself is unchanged: it still creates the GitHub Release in one
  # shot via softprops/action-gh-release. nas-upload-assets runs AFTER the
  # release is created and uses `gh release upload --clobber` to attach the
  # SPK/QPKG files. There is a brief window where the release is live without
  # NAS assets — acceptable because (a) the feed PR has not been merged yet
  # so DSM/QTS clients are not yet pointing at the new version, and (b)
  # restructuring the existing `release` job to create-then-publish a draft
  # is out of scope (the spec forbids editing the release job body beyond a
  # `needs:` entry).
  #
  # Likewise, nas-publish-feeds is NOT added to `release.needs` because that
  # would require restructuring `release` to publish a draft after feeds land.
  # The spec's fallback explicitly authorises this ordering when release.yml
  # creates the release in one shot.
  #
  # The pages.yml workflow watches `site/**` (see .github/workflows/pages.yml
  # paths filter) so once the PR opened by nas-publish-feeds is merged into
  # master, the existing Pages deploy picks up the new feeds automatically.
  # We open a PR rather than committing directly so a human reviews the
  # feed diff before Pages serves it — and so we don't have to edit
  # pages.yml (forbidden by the phase spec).
  # ===========================================================================

  nas-build-spk:
    needs: [manifest]
    runs-on: arc-azrtydxb
    container:
      image: node:24
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, armv8]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          V="${REF#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            bash tar gzip file gnupg2 coreutils ca-certificates jq
          which gpg tar file sha256sum md5sum jq

      - name: Detect signing secret availability
        id: secrets
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SYNOLOGY_SIGNING_KEY }}
        run: |
          if [ -n "${SIGNING_KEY:-}" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            echo "::error::SYNOLOGY_SIGNING_KEY is not set — release-grade SPKs must be signed."
            exit 1
          fi

      - name: Import GPG signing key
        id: gpg
        if: steps.secrets.outputs.have_key == 'true'
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SYNOLOGY_SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SYNOLOGY_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d -t kryton-gpg.XXXXXX)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          printf '%s' "$SIGNING_KEY" | gpg --batch --import
          cat > "$GNUPGHOME/gpg-agent.conf" <<'EOF'
          allow-loopback-pinentry
          EOF
          cat > "$GNUPGHOME/gpg.conf" <<'EOF'
          pinentry-mode loopback
          EOF
          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{print $5; exit}')"
          echo "key_id=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "gnupghome=$GNUPGHOME" >> "$GITHUB_OUTPUT"
          gpgconf --launch gpg-agent
          # Prime the gpg-agent with the passphrase via a throwaway sign.
          echo "prime" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SIGNING_PASSPHRASE" \
            --local-user "$KEY_ID" --armor --detach-sign --output /dev/null

      - name: Export public key for feed keyring (x86_64 only)
        # The keyring is identical across arches — export once from the
        # x86_64 job and upload as a single artifact consumed by
        # nas-publish-feeds.
        if: matrix.arch == 'x86_64'
        shell: bash
        env:
          GNUPGHOME: ${{ steps.gpg.outputs.gnupghome }}
          KEY_ID: ${{ steps.gpg.outputs.key_id }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/synology-pubkey"
          gpg --armor --export "$KEY_ID" > "${RUNNER_TEMP}/synology-pubkey/kryton.gpg"
          test -s "${RUNNER_TEMP}/synology-pubkey/kryton.gpg"

      - name: Upload Synology public key artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: synology-pubkey
          path: ${{ runner.temp }}/synology-pubkey/kryton.gpg
          if-no-files-found: error
          retention-days: 90

      - name: Build SPK
        id: build
        shell: bash
        env:
          KRYTON_VERSION: ${{ steps.ver.outputs.version }}
          KRYTON_ARCH: ${{ matrix.arch }}
          KRYTON_IMAGE: ghcr.io/${{ github.repository }}/kryton:${{ steps.ver.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/spk
          GPG_KEY_ID: ${{ steps.gpg.outputs.key_id }}
          GPG_KEYRING_DIR: ${{ steps.gpg.outputs.gnupghome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # build.sh prints size/sha256/md5 lines — capture them into the
          # step output as a JSON-safe block.
          LOG="$(bash packaging/synology/build.sh 2>&1 | tee /dev/stderr)"
          SIZE=$(printf '%s\n' "$LOG" | awk '/^size:/{print $2; exit}')
          MD5=$(printf '%s\n'  "$LOG" | awk '/^md5:/{print $2; exit}')
          # Canonical filename produced by build.sh.
          FILE="kryton_${KRYTON_VERSION}-0001_${KRYTON_ARCH}.spk"
          test -s "$OUT_DIR/$FILE" || { echo "::error::expected $FILE not produced"; exit 1; }
          echo "filename=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Emit SPK metadata JSON
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          FILENAME: ${{ steps.build.outputs.filename }}
          SIZE: ${{ steps.build.outputs.size }}
          MD5: ${{ steps.build.outputs.md5 }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/spk-meta"
          jq -n \
            --arg arch "$ARCH" \
            --arg filename "$FILENAME" \
            --argjson size "$SIZE" \
            --arg md5 "$MD5" \
            '{arch:$arch, filename:$filename, size:$size, md5:$md5}' \
            > "${RUNNER_TEMP}/spk-meta/spk-meta-${ARCH}.json"
          cat "${RUNNER_TEMP}/spk-meta/spk-meta-${ARCH}.json"

      - name: Upload SPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kryton-spk-${{ matrix.arch }}
          path: ${{ runner.temp }}/spk/*.spk
          if-no-files-found: error
          retention-days: 90

      - name: Upload SPK metadata
        uses: actions/upload-artifact@v4
        with:
          name: spk-meta-${{ matrix.arch }}
          path: ${{ runner.temp }}/spk-meta/spk-meta-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Scrub GPG home
        if: always()
        shell: bash
        run: |
          if [ -n "${{ steps.gpg.outputs.gnupghome }}" ]; then
            rm -rf "${{ steps.gpg.outputs.gnupghome }}" || true
          fi

  nas-build-qpkg:
    needs: [manifest]
    runs-on: arc-azrtydxb
    container:
      image: node:24
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [X86_64, ARM_64]
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          V="${REF#v}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          # build.sh names the file kryton_<ver>_<lower>.qpkg.
          case "${{ matrix.platform }}" in
            X86_64) echo "arch_lower=x86_64" >> "$GITHUB_OUTPUT" ;;
            ARM_64) echo "arch_lower=arm_64" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            bash tar gzip file openssl curl ca-certificates binutils imagemagick jq

      - name: Stage code-signing material
        id: sign
        shell: bash
        env:
          QNAP_CODESIGN_CERT: ${{ secrets.QNAP_CODESIGN_CERT }}
          QNAP_CODESIGN_KEY:  ${{ secrets.QNAP_CODESIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${QNAP_CODESIGN_CERT:-}" ] || [ -z "${QNAP_CODESIGN_KEY:-}" ]; then
            echo "::error::QNAP_CODESIGN_CERT / QNAP_CODESIGN_KEY are required for release-grade QPKGs"
            exit 1
          fi
          install -d -m 700 "${RUNNER_TEMP}/qnap-keys"
          printf '%s\n' "${QNAP_CODESIGN_CERT}" > "${RUNNER_TEMP}/qnap-keys/codesign.crt"
          printf '%s\n' "${QNAP_CODESIGN_KEY}"  > "${RUNNER_TEMP}/qnap-keys/codesign.key"
          chmod 600 "${RUNNER_TEMP}/qnap-keys/codesign.key"
          echo "cert=${RUNNER_TEMP}/qnap-keys/codesign.crt" >> "${GITHUB_OUTPUT}"
          echo "key=${RUNNER_TEMP}/qnap-keys/codesign.key"  >> "${GITHUB_OUTPUT}"

      - name: Build QPKG
        id: build
        shell: bash
        env:
          KRYTON_VERSION: ${{ steps.ver.outputs.version }}
          KRYTON_PLATFORM: ${{ matrix.platform }}
          KRYTON_IMAGE: ghcr.io/${{ github.repository }}/kryton:${{ steps.ver.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/qpkg
          QPKG_SIGNING_CERT: ${{ steps.sign.outputs.cert }}
          QPKG_SIGNING_KEY:  ${{ steps.sign.outputs.key }}
          ARCH_LOWER: ${{ steps.ver.outputs.arch_lower }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          LOG="$(bash packaging/qnap/build.sh 2>&1 | tee /dev/stderr)"
          SIZE=$(printf '%s\n' "$LOG" | awk -F': *' '/^size *:/{print $2; exit}' | awk '{print $1}')
          MD5=$(printf '%s\n'  "$LOG" | awk -F': *' '/^md5 *:/{print $2; exit}' | awk '{print $1}')
          FILE="kryton_${KRYTON_VERSION}_${ARCH_LOWER}.qpkg"
          test -s "$OUT_DIR/$FILE" || { echo "::error::expected $FILE not produced"; exit 1; }
          if [ -s "$OUT_DIR/${FILE}.codesigning" ]; then
            HAS_SIG="true"
          else
            HAS_SIG="false"
          fi
          echo "filename=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "has_signature=$HAS_SIG" >> "$GITHUB_OUTPUT"

      - name: Emit QPKG metadata JSON
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          FILENAME: ${{ steps.build.outputs.filename }}
          SIZE: ${{ steps.build.outputs.size }}
          MD5: ${{ steps.build.outputs.md5 }}
          HAS_SIG: ${{ steps.build.outputs.has_signature }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/qpkg-meta"
          jq -n \
            --arg platform "$PLATFORM" \
            --arg filename "$FILENAME" \
            --argjson size "$SIZE" \
            --arg md5 "$MD5" \
            --argjson has_signature "$HAS_SIG" \
            '{platform:$platform, filename:$filename, size:$size, md5:$md5, has_signature:$has_signature}' \
            > "${RUNNER_TEMP}/qpkg-meta/qpkg-meta-${PLATFORM}.json"
          cat "${RUNNER_TEMP}/qpkg-meta/qpkg-meta-${PLATFORM}.json"

      - name: Upload QPKG artifact (qpkg + .codesigning)
        uses: actions/upload-artifact@v4
        with:
          name: kryton-qpkg-${{ matrix.platform }}
          # Single glob (not multi-line) so upload-artifact@v4 places the
          # files at the artifact root. With a multi-line `path:` and
          # ${{ runner.temp }} containing a deep absolute prefix on this
          # self-hosted runner, v4 computed the common ancestor too high
          # and preserved the full /__w/_temp/qpkg/ path inside the
          # artifact — the downstream `--clobber` upload then missed them.
          path: ${{ runner.temp }}/qpkg/*.qpkg*
          if-no-files-found: error
          retention-days: 90

      - name: Upload QPKG metadata
        uses: actions/upload-artifact@v4
        with:
          name: qpkg-meta-${{ matrix.platform }}
          path: ${{ runner.temp }}/qpkg-meta/qpkg-meta-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Scrub signing key from disk
        if: always()
        shell: bash
        run: |
          if [ -d "${RUNNER_TEMP}/qnap-keys" ]; then
            find "${RUNNER_TEMP}/qnap-keys" -type f -exec shred -u {} + 2>/dev/null || true
            rm -rf "${RUNNER_TEMP}/qnap-keys"
          fi

  nas-upload-assets:
    # Attach SPK/QPKG files to the GitHub Release that `release` just
    # created. Uses `--clobber` so re-runs (workflow_dispatch with the
    # same tag) replace existing assets cleanly. Depends on `release`
    # because the release must exist before `gh release upload` can
    # target it.
    needs: [release, nas-build-spk, nas-build-qpkg]
    runs-on: arc-azrtydxb
    container:
      image: node:24
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${REF}" >> "$GITHUB_OUTPUT"

      - name: Install gh CLI
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends \
            curl ca-certificates gnupg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | gpg --dearmor -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -qq -y --no-install-recommends gh

      - name: Download SPK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kryton-spk-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Download QPKG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kryton-qpkg-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: List downloaded assets
        shell: bash
        run: ls -la "${RUNNER_TEMP}/dist"

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/dist"
          # Glob expands to all SPK, QPKG, and .codesigning siblings.
          shopt -s nullglob
          ASSETS=( *.spk *.qpkg *.qpkg.codesigning )
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::no NAS assets found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber --repo "${{ github.repository }}"

  nas-publish-feeds:
    # Render Synology + QNAP feeds with real artifact metadata and open a
    # PR that lands them in site/public/. Merging the PR triggers pages.yml
    # via its existing `site/**` path filter. We do not commit directly to
    # master so a human reviews the diff (and so we don't have to touch
    # pages.yml).
    needs: [nas-upload-assets]
    runs-on: arc-azrtydxb
    container:
      image: node:24
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        env:
          REF: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          echo "pub_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Download all NAS metadata artifacts
        uses: actions/download-artifact@v4
        with:
          # Captures spk-meta-*, qpkg-meta-*, and synology-pubkey artifacts.
          # download-artifact lays them out as one subdirectory per artifact
          # name under the given path — exactly what collect-metadata.mjs
          # expects.
          pattern: '{spk-meta-*,qpkg-meta-*,synology-pubkey}'
          path: ${{ runner.temp }}/meta

      - name: Inspect downloaded metadata
        shell: bash
        run: |
          set -euo pipefail
          ls -la "${RUNNER_TEMP}/meta" || true
          find "${RUNNER_TEMP}/meta" -type f | head -50

      - name: Build renderer config
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PUB_DATE: ${{ steps.ver.outputs.pub_date }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node packaging/feeds/collect-metadata.mjs \
            --version "$VERSION" \
            --repo "$REPO" \
            --pub-date "$PUB_DATE" \
            --meta-dir "${RUNNER_TEMP}/meta" \
            --out "${RUNNER_TEMP}/feed-config.json"
          cat "${RUNNER_TEMP}/feed-config.json"

      - name: Render feeds (strict)
        shell: bash
        run: |
          set -euo pipefail
          node packaging/feeds/render.mjs \
            --strict \
            --config "${RUNNER_TEMP}/feed-config.json"

      - name: Renderer self-test
        shell: bash
        run: node --test packaging/feeds/render.test.mjs

      - name: Open PR with rendered feeds
        uses: peter-evans/create-pull-request@v6
        with:
          branch: nas-feeds/v${{ steps.ver.outputs.version }}
          base: master
          commit-message: |
            feat(nas): publish NAS feeds for v${{ steps.ver.outputs.version }}

            Auto-generated by release.yml → nas-publish-feeds using real
            artifact sizes/md5/signatures from the SPK and QPKG builds.
          title: 'feat(nas): publish NAS feeds for v${{ steps.ver.outputs.version }}'
          body: |
            Phase 4 of `docs/design/nas-package-stores.md`.

            Renders `site/public/synology/index.json` and
            `site/public/qnap/packages.xml` for version
            `${{ steps.ver.outputs.version }}` using real artifact metadata
            collected from the `nas-build-spk` and `nas-build-qpkg` jobs.

            Merging this PR triggers `pages.yml` via its existing
            `site/**` path filter, which redeploys the Pages site with the new
            feeds visible at:

            - https://azrtydxb.github.io/kryton/synology/index.json
            - https://azrtydxb.github.io/kryton/qnap/packages.xml
          delete-branch: true
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
