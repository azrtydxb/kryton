name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kryton
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate before publishing: typecheck, lint, unit tests, AND the full
  # E2E suite (API + MCP + session-restart-persistence). Same shape as
  # ci.yml's build job, plus the e2e step. A red here blocks the docker
  # build/push and the GitHub release.
  ci:
    # ARC v2 scale-set on the kw cluster (k3s ARM64). Ephemeral runner
    # pods with a dind sidecar.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (ui, sdk)
        run: npm run build:shared

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server

      - name: Unit tests
        run: npm run test
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173

      - name: E2E suite (API + MCP + restart-persistence)
        run: npm run test:e2e --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          SEMANTIC_PROVIDER: "off"

      - name: Build
        run: npm run build

      - name: Restore workspace ownership to runner user
        # ARC runner UID is 1001; the job container runs as root and
        # would otherwise leave root-owned files in the bind-mounted
        # workspace, blocking post-job cleanup.
        if: always()
        run: chown -R 1001:1001 . || true

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist

  # Multi-arch docker build + push, entirely on ARC. arm64 builds in
  # the dind sidecar natively; amd64 builds on the remote BuildKit at
  # 192.168.10.253:1234 natively (~15× faster than QEMU). Both push by
  # digest to ghcr.io, then a single `buildx imagetools create`
  # assembles the manifest list. Replaces the old GH-hosted matrix
  # (ubuntu-latest amd64 + ubuntu-24.04-arm arm64) + separate manifest
  # job.
  #
  # The cookbook's `--name multi --append` snippet doesn't work in
  # current buildx (mixed drivers are unsupported). The two-builder
  # pattern below was verified by the arc-smoke workflow.
  docker:
    needs: ci
    runs-on: arc-azrtydxb
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up two buildx builders
        run: |
          # arm64 native via the dind sidecar.
          docker buildx create \
            --name local-arm64 \
            --driver docker-container \
            --platform linux/arm64

          # amd64 native via the remote BuildKit on 192.168.10.253.
          # Certs + endpoint are auto-injected into every arc-azrtydxb
          # runner pod by the AutoscalingRunnerSet template.
          docker buildx create \
            --name remote-amd64 \
            --driver remote \
            --platform linux/amd64 \
            --driver-opt cacert="$BUILDKIT_CLIENT_CA" \
            --driver-opt cert="$BUILDKIT_CLIENT_CERT" \
            --driver-opt key="$BUILDKIT_CLIENT_KEY" \
            "$BUILDKIT_AMD64_ENDPOINT"

          docker buildx inspect --bootstrap local-arm64
          docker buildx inspect --bootstrap remote-amd64

      - name: Build + push arm64 (digest only)
        id: build_arm64
        run: |
          docker buildx build \
            --builder local-arm64 \
            --platform linux/arm64 \
            --labels '${{ steps.meta.outputs.labels }}' \
            --cache-from type=gha,scope=linux-arm64 \
            --cache-to type=gha,mode=max,scope=linux-arm64 \
            --output type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true \
            --metadata-file arm64-meta.json \
            .
          ARM_DIGEST=$(jq -r '."containerimage.digest"' arm64-meta.json)
          echo "digest=$ARM_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build + push amd64 (digest only)
        id: build_amd64
        run: |
          docker buildx build \
            --builder remote-amd64 \
            --platform linux/amd64 \
            --labels '${{ steps.meta.outputs.labels }}' \
            --cache-from type=gha,scope=linux-amd64 \
            --cache-to type=gha,mode=max,scope=linux-amd64 \
            --output type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true \
            --metadata-file amd64-meta.json \
            .
          AMD_DIGEST=$(jq -r '."containerimage.digest"' amd64-meta.json)
          echo "digest=$AMD_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Assemble multi-arch manifest list
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_arm64.outputs.digest }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build_amd64.outputs.digest }}"

      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  release:
    needs: [ci, docker]
    runs-on: arc-azrtydxb
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
