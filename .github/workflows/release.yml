name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kryton
  OPERATOR_IMAGE_NAME: ${{ github.repository }}/kryton-operator
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Layout:
#
#   typecheck ─┐
#   lint       │                                                  ┌── helm-publish ──┐
#   test       ├── build-arm64 ────────────┐                      │                  │
#   e2e        │                           ├── manifest ──────────┼── mirror         ├── release
#   build ─────┴── build-amd64 ────────────┘                      │                  │
#               ├── build-operator-arm64 ─┐                       └── manifest-operator
#               └── build-operator-amd64 ─┴── manifest-operator ──┘
#
# Server image DAG (top half) mirrors the prior shape unchanged.
# Operator image DAG (bottom half) follows the same per-arch pattern:
# local-arm64 dind + remote-amd64 NAS BuildKit, then `manifest-
# operator` stitches the digests. `helm-publish` packages and pushes
# the chart OCI artifact in parallel with the server `manifest` chain.
# `mirror` is extended to copy the chart and operator image to the
# cluster zot alongside the server image. `release` waits on the
# server manifest, the operator manifest, and helm-publish.

jobs:
  typecheck:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run typecheck
      - if: always()
        run: chown -R 1001:1001 . || true

  lint:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - if: always()
        run: chown -R 1001:1001 . || true

  test:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server
      - name: Unit tests
        run: npm run test
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
      - if: always()
        run: chown -R 1001:1001 . || true

  e2e:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server
      - name: E2E suite (API + MCP + restart-persistence)
        run: npm run test:e2e --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          SEMANTIC_PROVIDER: "off"
      - if: always()
        run: chown -R 1001:1001 . || true

  build:
    # Produces server-dist + client-dist artifacts consumed by the
    # docker fan-out. Doesn't gate on typecheck/lint/test — those run
    # in parallel as siblings; their failure independently blocks the
    # docker jobs via `needs`.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build
      - if: always()
        run: chown -R 1001:1001 . || true
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist

  # Multi-arch docker build/push, fan-out per arch. arm64 builds in
  # the dind sidecar natively; amd64 builds on the remote BuildKit at
  # 192.168.10.253:1234 natively (~15× faster than QEMU). Each job
  # pushes by digest to ghcr.io; the `manifest` job assembles the
  # final multi-arch tags. Splitting per arch lets the two builders
  # run truly concurrently instead of sequentially in one job.
  #
  # The cookbook's `--name multi --append` snippet doesn't work in
  # current buildx (mixed drivers are unsupported). Per-job builders
  # sidestep that entirely.
  build-arm64:
    needs: [typecheck, lint, test, e2e, build]
    # `arc-azrtydxb-publish` is identical to `arc-azrtydxb` except its
    # pod template omits the `ghcr.io → 192.168.10.122` hostAlias. The
    # mirror is a pull-through cache that doesn't accept writes AND
    # serves a cluster-CA-signed cert that buildkit-container doesn't
    # trust — both made push from inside dind fail with a TLS
    # 'unknown authority' error on the regular arc-azrtydxb scale set.
    # Without the hostAlias, ghcr.io resolves to its real public CDN
    # via CoreDNS and pushes work with the standard public TLS chain.
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up local arm64 builder
        run: |
          # arm64 native via the dind sidecar.  The inline buildkitd
          # config marks the cluster zot registry as insecure so this
          # builder can push/pull cache layers without needing the
          # cluster CA in buildkit-container's trust store.
          cat > /tmp/buildkitd-local.toml <<'EOF'
          [registry."192.168.10.123:5000"]
            http = false
            insecure = true
          EOF
          docker buildx create \
            --name local-arm64 \
            --driver docker-container \
            --platform linux/arm64 \
            --buildkitd-config /tmp/buildkitd-local.toml
          docker buildx inspect --bootstrap local-arm64
      - name: Build + push arm64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: local-arm64
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          # Buildkit cache lives in the in-cluster zot registry at
          # 192.168.10.123:5000 — pushes/pulls over the cluster LAN
          # instead of GHA cache over the NAS uplink. mode=max stores
          # all intermediate layers (full hit rate); image-manifest=true
          # uses OCI manifest format which buildx and crane both prefer.
          cache-from: type=registry,ref=192.168.10.123:5000/buildcache/kryton:linux-arm64
          cache-to: type=registry,ref=192.168.10.123:5000/buildcache/kryton:linux-arm64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  build-amd64:
    needs: [typecheck, lint, test, e2e, build]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist
      - uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up remote amd64 builder
        run: |
          # amd64 native via the remote BuildKit on 192.168.10.253.
          # Certs + endpoint are auto-injected into every arc-azrtydxb
          # runner pod by the AutoscalingRunnerSet template. Remote-
          # driver builders inherit the daemon's registry trust config;
          # we cannot patch it from the workflow.
          docker buildx create \
            --name remote-amd64 \
            --driver remote \
            --platform linux/amd64 \
            --driver-opt cacert="$BUILDKIT_CLIENT_CA" \
            --driver-opt cert="$BUILDKIT_CLIENT_CERT" \
            --driver-opt key="$BUILDKIT_CLIENT_KEY" \
            "$BUILDKIT_AMD64_ENDPOINT"
          docker buildx inspect --bootstrap remote-amd64
      - name: Build + push amd64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: remote-amd64
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          # Cache goes to ghcr.io instead of the cluster zot. The NAS
          # buildkit-container's /etc/buildkit/buildkitd.toml does NOT
          # currently trust the cluster CA, so pushing cache layers to
          # https://192.168.10.123:5000 fails with x509 unknown-
          # authority. ghcr.io has a public CA chain that everything
          # trusts and we're already authenticated for image push.
          # TODO: when buildkit-container on the NAS gets cluster-
          # ca.crt mounted + buildkitd.toml updated, switch back to
          # 192.168.10.123:5000/buildcache/kryton:linux-amd64 for the
          # LAN-speed advantage.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:linux-amd64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:linux-amd64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  manifest:
    needs: [build-arm64, build-amd64]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Assemble multi-arch manifest list
        # The per-arch jobs' `digest` outputs are the sha256 of each
        # pushed image. `imagetools create` stitches them into a
        # manifest list under the human-friendly tags from
        # metadata-action.
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-arm64.outputs.digest }}" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-amd64.outputs.digest }}"
      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

  # Mirror the freshly-published multi-arch image from ghcr.io to the
  # in-cluster zot at 192.168.10.123:5000 so harbor.kw.local shows the
  # latest kryton tags too. Uses `docker buildx imagetools create`,
  # which does a server-side registry-to-registry transfer (no
  # rebuild, no local pull) and preserves the multi-arch manifest
  # list. Anonymous push works — same path the arm64 buildcache has
  # been using since the cluster zot was wired up. Runs in parallel
  # with `release`; not a gate (mirror failures don't block the
  # GitHub release).
  mirror:
    # Needs both image manifests AND the helm chart push: mirror copies
    # all three artifacts to the cluster zot, and reading the chart
    # back from ghcr races against helm-publish's push otherwise.
    needs: [manifest, manifest-operator, helm-publish]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to ghcr (source)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Mirror server tags to cluster zot
        # `docker buildx imagetools create` is client-side and ignores
        # the buildkitd insecure-registry config, so cross-registry
        # copies to the cluster zot (cluster-CA cert) fail with x509
        # unknown-authority. skopeo has explicit per-direction TLS
        # flags. Run via the official quay.io/skopeo/stable image
        # because the runner user can't apt-get (non-root pod). The
        # dind sidecar can't see the runner pod's ~/.docker/config.json,
        # so credentials are passed via --src-creds populated from a
        # step env that github actions resolves before bash runs.
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for src in $(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON"); do
            dst="${src/ghcr.io/192.168.10.123:5000}"
            echo "Mirroring server: $src → $dst"
            docker run --rm quay.io/skopeo/stable copy --multi-arch all \
              --src-tls-verify=true --dest-tls-verify=false \
              --src-creds="$SRC_CREDS" \
              "docker://$src" "docker://$dst"
          done
      - name: Extract operator metadata
        id: meta-operator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Mirror operator tags to cluster zot
        env:
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for src in $(jq -r '.tags[]' <<< '${{ steps.meta-operator.outputs.json }}'); do
            dst="${src/ghcr.io/192.168.10.123:5000}"
            echo "Mirroring operator: $src → $dst"
            docker run --rm quay.io/skopeo/stable copy --multi-arch all \
              --src-tls-verify=true --dest-tls-verify=false \
              --src-creds="$SRC_CREDS" \
              "docker://$src" "docker://$dst"
          done
      - name: Mirror helm chart artifact to cluster zot
        env:
          VERSION: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          SRC_CREDS: ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHART_VER="${VERSION#v}"
          SRC="ghcr.io/${OWNER}/charts/kryton:${CHART_VER}"
          DST="192.168.10.123:5000/${OWNER}/charts/kryton:${CHART_VER}"
          echo "Mirroring chart: $SRC → $DST"
          docker run --rm quay.io/skopeo/stable copy \
            --src-tls-verify=true --dest-tls-verify=false \
            --src-creds="$SRC_CREDS" \
            "docker://$SRC" "docker://$DST"

  # Package + push the Helm chart as an OCI artifact to ghcr.io.
  # Runs in parallel with `mirror` and `release`; gated on `manifest`
  # so the server image referenced by the chart's appVersion exists
  # by the time the chart is published.
  helm-publish:
    needs: [manifest]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      chart-ref: ${{ steps.push.outputs.chart-ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Log in to ghcr (helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin
      - name: Resolve chart version from tag
        id: ver
        run: |
          REF="${GITHUB_REF_NAME}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
      - name: Helm dependency update
        run: helm dependency update charts/kryton
      - name: Unpack subchart tgzs
        # `helm package` rejects tgz-only deps with a misleading
        # "missing in charts/ directory" error. Unpack each tgz into
        # the directory layout it actually wants.
        run: |
          set -euo pipefail
          cd charts/kryton/charts
          for f in *.tgz; do
            [ -f "$f" ] || continue
            tar -xzf "$f"
            rm "$f"
          done
          ls
      - name: Helm package
        run: |
          helm package charts/kryton \
            --version "${{ steps.ver.outputs.version }}" \
            --app-version "${{ steps.ver.outputs.version }}" \
            --destination .
      - name: Helm push to ghcr
        id: push
        run: |
          set -euo pipefail
          PKG="kryton-${{ steps.ver.outputs.version }}.tgz"
          DEST="oci://ghcr.io/${{ github.repository_owner }}/charts"
          echo "Pushing $PKG → $DEST"
          helm push "$PKG" "$DEST"
          echo "chart-ref=ghcr.io/${{ github.repository_owner }}/charts/kryton:${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"

  # Operator image build, fan-out per arch. Mirrors the per-arch
  # pattern used for the server image: local-arm64 dind, remote-amd64
  # NAS BuildKit. arm64 cache → cluster zot, amd64 cache → ghcr (per
  # the cluster-CA trust gap on the NAS buildkit-container).
  build-operator-arm64:
    needs: [typecheck, lint, test, e2e]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync chart into operator embed
        # The operator's Dockerfile expects the helm chart at
        # operator/internal/chartfs/chart/. The chart lives at
        # charts/kryton/; sync-chart copies it in. Without this step
        # the build would embed the placeholder chart from WS-C bring-
        # up, not the real one.
        run: rm -rf operator/internal/chartfs/chart && mkdir -p operator/internal/chartfs/chart && cp -R charts/kryton/. operator/internal/chartfs/chart/
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up local arm64 builder
        run: |
          cat > /tmp/buildkitd-local.toml <<'EOF'
          [registry."192.168.10.123:5000"]
            http = false
            insecure = true
          EOF
          docker buildx create \
            --name local-arm64-operator \
            --driver docker-container \
            --platform linux/arm64 \
            --buildkitd-config /tmp/buildkitd-local.toml
          docker buildx inspect --bootstrap local-arm64-operator
      - name: Build + push operator arm64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          builder: local-arm64-operator
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=192.168.10.123:5000/buildcache/kryton-operator:linux-arm64
          cache-to: type=registry,ref=192.168.10.123:5000/buildcache/kryton-operator:linux-arm64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  build-operator-amd64:
    needs: [typecheck, lint, test, e2e]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync chart into operator embed
        run: rm -rf operator/internal/chartfs/chart && mkdir -p operator/internal/chartfs/chart && cp -R charts/kryton/. operator/internal/chartfs/chart/
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Set up remote amd64 builder
        run: |
          docker buildx create \
            --name remote-amd64-operator \
            --driver remote \
            --platform linux/amd64 \
            --driver-opt cacert="$BUILDKIT_CLIENT_CA" \
            --driver-opt cert="$BUILDKIT_CLIENT_CERT" \
            --driver-opt key="$BUILDKIT_CLIENT_KEY" \
            "$BUILDKIT_AMD64_ENDPOINT"
          docker buildx inspect --bootstrap remote-amd64-operator
      - name: Build + push operator amd64 (digest only)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: operator
          file: operator/Dockerfile
          builder: remote-amd64-operator
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache-operator:linux-amd64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache-operator:linux-amd64,mode=max,image-manifest=true
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true

  manifest-operator:
    needs: [build-operator-arm64, build-operator-amd64]
    runs-on: arc-azrtydxb-publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Assemble multi-arch operator manifest list
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}@${{ needs.build-operator-arm64.outputs.digest }}" \
            "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}@${{ needs.build-operator-amd64.outputs.digest }}"
      - name: Inspect operator manifest
        run: docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.OPERATOR_IMAGE_NAME }}:latest"
      - name: Upload CRD bundle as release asset
        # The CRD bundle from `make manifests` under operator/config/crd/bases
        # is published as a workflow artifact here so the `release` job
        # can attach it to the GitHub Release.
        uses: actions/upload-artifact@v4
        with:
          name: operator-crd-bundle
          path: operator/config/crd/bases/

  release:
    needs: [typecheck, lint, test, e2e, build, manifest, manifest-operator, helm-publish]
    runs-on: arc-azrtydxb
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
      - name: Download CRD bundle
        uses: actions/download-artifact@v4
        with:
          name: operator-crd-bundle
          path: crd-bundle
      - name: Bundle CRDs into single yaml
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [ -d crd-bundle ] && [ -n "$(ls -A crd-bundle 2>/dev/null)" ]; then
            # Concatenate every CRD into a single multi-document yaml so
            # users can `kubectl apply -f kryton-crds.yaml` in one shot.
            first=1
            for f in crd-bundle/*.yaml; do
              if [ $first -eq 0 ]; then
                echo "---" >> release-assets/kryton-crds.yaml
              fi
              cat "$f" >> release-assets/kryton-crds.yaml
              first=0
            done
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          generate_release_notes: false
          files: |
            release-assets/kryton-crds.yaml
