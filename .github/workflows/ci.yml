name: CI

# Fast tier — runs on every push to master + every PR. Typecheck,
# lint, unit tests, build, OpenAPI snapshot. No E2E suite, no docker
# image push (those live in e2e.yml / release.yml respectively).
#
# Trigger the full E2E suite manually from the Actions tab → "E2E"
# workflow → Run workflow. Tag a `v*` commit to cut a release (runs
# E2E gate + docker build/push + GitHub release).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: [self-hosted, kryton-248]
    # Run inside a node container so the service-container postgres is
    # reachable via its docker-network hostname (`postgres:5432`) instead
    # of via a host-published port. Lets multiple jobs run on the same
    # self-hosted box in parallel without colliding on a host port.
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (ui, sdk)
        run: npm run build:shared

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server

      - name: Unit tests
        run: npm run test
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173

      - name: Build
        run: npm run build

      - name: OpenAPI snapshot drift check
        run: npm run openapi:check --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          OPENAPI_ENABLED: "true"

      - name: Restore workspace ownership to host user
        # Container runs as root by default — files written here end up
        # owned by root on the host runner's bind-mounted workspace.
        # That blocks the next job's actions/checkout cleanup. Hand
        # ownership back to piwi (1000:1000) before exiting so any
        # subsequent host-based job can clean cleanly.
        # `if: always()` ensures this runs on failure too.
        if: always()
        run: chown -R 1000:1000 . || true
