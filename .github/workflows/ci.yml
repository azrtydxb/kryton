name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/kryton
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: [self-hosted, kryton-248]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (ui, sdk)
        run: npm run build:shared

      - name: TypeCheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install pgvector extension
        env:
          PGPASSWORD: kryton
        run: |
          psql -h localhost -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server

      - name: Test
        run: npm run test
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173

      - name: Build
        run: npm run build

      - name: OpenAPI snapshot drift check
        run: npm run openapi:check --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          OPENAPI_ENABLED: "true"

      - name: Upload client dist
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Upload server dist
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist

  # Full Kryton boot + HTTP API + MCP transport + restart-persistence
  # tests. Runs as its own job so a flake in the unit suite doesn't
  # mask an E2E regression (and vice versa). Reuses the same Postgres
  # service-container shape as the unit job.
  e2e:
    runs-on: [self-hosted, kryton-248]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages (ui, sdk)
        run: npm run build:shared

      - name: Install pgvector extension
        env:
          PGPASSWORD: kryton
        run: |
          psql -h localhost -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"

      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server

      - name: E2E suite
        run: npm run test:e2e --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@localhost:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          SEMANTIC_PROVIDER: "off"

  docker:
    needs: build
    runs-on: [self-hosted, kryton-248]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download client dist
        uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: packages/client/dist

      - name: Download server dist
        uses: actions/download-artifact@v4
        with:
          name: server-dist
          path: packages/server/dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
