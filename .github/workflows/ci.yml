name: CI

# Fast tier — runs on every push to master + every PR. Typecheck,
# lint, unit tests, build, OpenAPI snapshot. No E2E suite, no docker
# image push (those live in e2e.yml / release.yml respectively).
#
# Trigger the full E2E suite manually from the Actions tab → "E2E"
# workflow → Run workflow. Tag a `v*` commit to cut a release (runs
# E2E gate + docker build/push + GitHub release).
#
# Layout: five parallel jobs (typecheck, lint, test-build,
# openapi-check, deployment-sync-check) — each runs its own cached
# `npm ci` on a fresh ARC pod. Wall clock = max(slowest job) instead
# of sum.

on:
  push:
    branches: [master]
    # Don't burn CI on doc-only pushes to master. The release.yml
    # workflow has its own gates so this is just the fast-tier
    # feedback loop.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
    # PRs that touch only Markdown / docs don't change shipped behaviour
    # and don't need to run the full test suite. The design-doc PRs
    # under docs/superpowers/specs/** were sitting blocked on flaky CI
    # for changes that couldn't possibly break tests.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'

# Cancel any in-progress run on the same branch when a new push lands.
# The self-hosted runner pool is small (single 248 box, three runners),
# and stacking two CI runs from the same PR — the second push and the
# leftover first push — was hitting vitest worker-spawn timeouts and
# fastify boot timeouts because the runner was CPU-starved. Cancelling
# the older run frees the runner for the newest commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build shared packages (ui, sdk)
        run: npm run build:shared
      - name: TypeCheck
        run: npm run typecheck
      - name: Restore workspace ownership to runner user
        if: always()
        run: chown -R 1001:1001 . || true

  lint:
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Restore workspace ownership to runner user
        if: always()
        run: chown -R 1001:1001 . || true

  test-build:
    # Unit tests + production build kept together: the build step
    # exercises the same workspace state the tests left behind and the
    # two share install/build:shared cost. Postgres lives here for the
    # unit-test suite.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build shared packages (ui, sdk)
        run: npm run build:shared
      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server
      - name: Unit tests
        run: npm run test
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          TEST_DATABASE_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
      - name: Build
        run: npm run build
      - name: Restore workspace ownership to runner user
        if: always()
        run: chown -R 1001:1001 . || true

  deployment-sync-check:
    # Drift-prevention gate. Verifies the server config schema
    # (packages/server/config-schema.json — produced by WS-A) is in
    # lockstep with docker-compose.prod.yml, the Helm chart at
    # charts/kryton/, and the operator CRD at
    # operator/config/crd/bases/. Tolerates missing artifacts during
    # initial bring-up of the parallel workstreams that deliver them;
    # the gate activates retroactively as each surface lands.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Install helm + kubeconform
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates
          # arc-azrtydxb is ARM64 — pick the right arch instead of hard-coding amd64.
          case "$(uname -m)" in
            aarch64|arm64) ARCH=arm64 ;;
            x86_64) ARCH=amd64 ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://get.helm.sh/helm-v3.16.3-linux-${ARCH}.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/linux-${ARCH}/helm" /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-${ARCH}.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          helm version
          kubeconform -v
      - name: Fetch helm chart dependencies
        shell: bash
        run: |
          set -euo pipefail
          # sync:check shells out to `helm template charts/kryton`. helm's
          # CheckDependencies refuses to load when Chart.lock + the on-disk
          # tarball + the freshly-published upstream chart disagree on digest
          # (bitnami occasionally republishes the same version). Wipe the
          # tracked tarball + lock first so `dependency update` resolves
          # everything in one consistent fetch.
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update bitnami
          rm -f charts/kryton/Chart.lock charts/kryton/charts/*.tgz
          helm dependency update charts/kryton
          ls -la charts/kryton/charts/
          cat charts/kryton/Chart.lock
          echo '--- helm version ---'
          helm version
          echo '--- subchart tarball metadata ---'
          ls -la charts/kryton/charts/
          file charts/kryton/charts/postgresql-16.4.5.tgz || true
          echo '--- unpack the tarball manually so the loader can find it ---'
          # helm 3.16.3 fails to load the bitnami postgresql tarball as a
          # subchart in this runner; unpacked-dir form loads reliably.
          tar -xzf charts/kryton/charts/postgresql-16.4.5.tgz -C charts/kryton/charts/
          ls -la charts/kryton/charts/
          echo '--- helm lint after unpack ---'
          helm lint charts/kryton
      - name: Deployment sync check
        run: npm run sync:check
      - name: Restore workspace ownership to runner user
        if: always()
        run: chown -R 1001:1001 . || true

  openapi-check:
    # Snapshot drift gate. Splits off from test-build because the
    # check is cheap and doesn't depend on the production build, only
    # on build:shared. Postgres is required because route registration
    # opens DB connections during spec extraction.
    runs-on: arc-azrtydxb
    container:
      image: node:24
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kryton
          POSTGRES_PASSWORD: kryton
          POSTGRES_DB: kryton_test
        options: >-
          --health-cmd "pg_isready -U kryton -d kryton_test"
          --health-interval 5s
          --health-retries 10
          --health-timeout 3s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build shared packages (ui, sdk)
        run: npm run build:shared
      - name: Install pgvector extension + psql client
        env:
          PGPASSWORD: kryton
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql-client
          psql -h postgres -U kryton -d kryton_test -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Run drizzle migrations
        env:
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
        run: npm run db:migrate --workspace=packages/server
      - name: OpenAPI snapshot drift check
        run: npm run openapi:check --workspace=packages/server
        env:
          NODE_ENV: test
          POSTGRES_URL: postgres://kryton:kryton@postgres:5432/kryton_test
          BETTER_AUTH_SECRET: ci-test-secret-must-be-at-least-32-characters-long
          BETTER_AUTH_URL: http://localhost:3001
          APP_URL: http://localhost:5173
          OPENAPI_ENABLED: "true"
      - name: Restore workspace ownership to runner user
        if: always()
        run: chown -R 1001:1001 . || true
