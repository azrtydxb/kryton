apiVersion: sync.kuvryn.io/v1alpha1
kind: Application
metadata:
  name: kryton-operator
  namespace: kryton-operator-system
spec:
  serviceAccountName: kuvryn-sync-deployer
  source:
    repositoryRef:
      name: kryton
    revision: master
    path: deploy/kuvryn-sync/operator
    render:
      type: yaml
  destination:
    namespace: kryton-operator-system
  sync:
    automatic: true
    conflictPolicy: fail
    prune: false
    selfHeal: true
  strategy:
    type: rolling
    failurePolicy:
      action: rollback
      maxAttempts: 2
      timeout: 10m
  health:
    timeout: 10m
  history:
    limit: 10
  deletionPolicy: Orphan
