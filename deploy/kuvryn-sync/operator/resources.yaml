apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: krytons.kryton.azrtydxb.io
  annotations:
    sync.kuvryn.io/prune: disabled
  labels:
    app.kubernetes.io/managed-by: kuvryn-sync
spec:
  conversion:
    strategy: None
  group: kryton.azrtydxb.io
  names:
    kind: Kryton
    listKind: KrytonList
    plural: krytons
    singular: kryton
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Kryton is the Schema for the krytons API.
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: 'KrytonSpec describes the desired state of a Kryton instance.

              `values` is passed through to the embedded helm chart; the other fields

              are reconciled by operator-only controllers (backup, plugins, snapshot).

              '
            properties:
              backup:
                description: Postgres backup CronJob configuration.
                properties:
                  objectStore:
                    description: 'S3-compatible object store target (MinIO, Garage,
                      SeaweedFS,

                      or any other service that speaks the S3 protocol). No AWS-

                      specific behaviour; endpoint is always explicit.

                      '
                    properties:
                      bucket:
                        type: string
                      credentialsSecretRef:
                        description: Name of a Secret with keys OBJECT_STORE_ACCESS_KEY
                          and OBJECT_STORE_SECRET_KEY.
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                      endpoint:
                        description: Full URL of the S3-compatible service (e.g. https://minio.kw.local).
                        type: string
                      prefix:
                        description: Key prefix inside the bucket. Defaults to "<cr-name>/".
                        type: string
                      region:
                        description: Optional. Some implementations ignore it but
                          mc still wants the field set.
                        type: string
                    required:
                    - bucket
                    - endpoint
                    type: object
                  retention:
                    description: Retention duration (e.g. "30d"). Older objects in
                      the target bucket are swept.
                    type: string
                  schedule:
                    description: Cron expression (UTC) for pg_dump.
                    type: string
                required:
                - schedule
                type: object
              plugins:
                description: 'Plugins to pre-install via an init-container. Each is
                  downloaded

                  from `url`, verified against `sha256`, and dropped into the

                  persistence volume''s plugins directory.

                  '
                items:
                  properties:
                    name:
                      type: string
                    sha256:
                      description: Hex-encoded SHA-256 digest of the plugin archive.
                      pattern: ^[a-fA-F0-9]{64}$
                      type: string
                    url:
                      type: string
                  required:
                  - name
                  - url
                  - sha256
                  type: object
                type: array
              snapshot:
                description: VolumeSnapshot schedule for the persistence PVC.
                properties:
                  retention:
                    type: string
                  schedule:
                    type: string
                  volumeSnapshotClassName:
                    type: string
                required:
                - schedule
                type: object
              values:
                description: Passthrough values forwarded to the embedded helm chart.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              version:
                description: appVersion of the kryton server image to deploy.
                type: string
            required:
            - version
            type: object
          status:
            description: KrytonStatus reflects the observed state.
            properties:
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              helmRevision:
                type: integer
              observedVersion:
                type: string
            type: object
            x-kubernetes-preserve-unknown-fields: true
        type: object
    served: true
    storage: true
    subresources:
      status: {}
