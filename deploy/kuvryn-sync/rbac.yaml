apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuvryn-sync-deployer
  namespace: watteel-kryton
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuvryn-sync-deployer
  namespace: watteel-kryton
rules:
- apiGroups:
  - ''
  resources:
  - pods
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - discovery.k8s.io
  resources:
  - endpointslices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kryton.azrtydxb.io
  resources:
  - krytons
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuvryn-sync-deployer
  namespace: watteel-kryton
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuvryn-sync-deployer
subjects:
- kind: ServiceAccount
  name: kuvryn-sync-deployer
  namespace: watteel-kryton
