apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# We need to manage Helm release secrets
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - "*"
# We need to create events on CRs about things happening during reconciliation
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create

##
## Rules for kryton.azrtydxb.io/v1alpha1, Kind: Kryton
##
- apiGroups:
  - kryton.azrtydxb.io
  resources:
  - krytons
  - krytons/status
  - krytons/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- verbs:
  - "*"
  apiGroups:
  - ""
  resources:
  - "services"
- verbs:
  - "*"
  apiGroups:
  - "apps"
  resources:
  - "deployments"
  - "statefulsets"
# helm's post-apply Wait introspects rollout health by listing
# ReplicaSets (Deployment) and ControllerRevisions (StatefulSet) in the
# CR's namespace. Without this grant the helm upgrade succeeds but
# Wait fails with "replicasets.apps is forbidden", Atomic rolls back,
# and the release flaps between failed/rollback states forever.
- verbs:
  - get
  - list
  - watch
  apiGroups:
  - "apps"
  resources:
  - "replicasets"
  - "controllerrevisions"
# Wait also Lists Pods to confirm readiness (Deployment, StatefulSet
# scale up + readiness probes).
- verbs:
  - get
  - list
  - watch
  apiGroups:
  - ""
  resources:
  - "pods"
# The bitnami postgresql subchart renders a PodDisruptionBudget.
- apiGroups:
  - "policy"
  resources:
  - "poddisruptionbudgets"
  verbs:
  - "*"

##
## Rules for operator-only fields (backup, plugins, snapshot).
##
- apiGroups:
  - ""
  resources:
  - configmaps
  - persistentvolumeclaims
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  - volumesnapshotclasses
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# The bitnami postgresql subchart renders a NetworkPolicy; without this
# grant the helm upgrade fails with a forbidden error from the resource
# diff step that the helm action client runs before applying.
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# +kubebuilder:scaffold:rules
