apiVersion: kryton.azrtydxb.io/v1alpha1
kind: Kryton
metadata:
  name: kryton-sample
spec:
  version: "4.5.0"
  values:
    ingress:
      enabled: false
    postgresql:
      enabled: true
  backup:
    schedule: "0 3 * * *"
    retention: "30d"
    objectStore:
      bucket: kryton-backups
      endpoint: https://minio.kw.local
      prefix: kryton-sample/
      credentialsSecretRef:
        name: kryton-backup-creds
  plugins: []
  snapshot:
    schedule: "0 4 * * *"
    retention: "7d"
