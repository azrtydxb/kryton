# Multi-instance example: two Kryton CRs in the same namespace.
# Operator passes fullnameOverride: <metadata.name> to helm so releases never collide.
---
apiVersion: kryton.azrtydxb.io/v1alpha1
kind: Kryton
metadata:
  name: kryton-team-a
spec:
  version: "4.5.0"
  values:
    ingress:
      enabled: true
      host: team-a.kryton.example.com
---
apiVersion: kryton.azrtydxb.io/v1alpha1
kind: Kryton
metadata:
  name: kryton-team-b
spec:
  version: "4.5.0"
  values:
    ingress:
      enabled: true
      host: team-b.kryton.example.com
